+name: Windows EXE
on:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '.github/workflows/windows.yml'
      - 'LEIA-ME.md'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $compiler)) { throw 'C# compiler not found' }
          & $compiler /nologo /codepage:65001 /target:winexe /win32icon:assets/app.ico /resource:assets/logo.png,Logo /resource:assets/background.jpg,Background /resource:assets/app.ico,AppIcon /platform:anycpu /out:dist/XCIPTV-PC.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /reference:System.Core.dll /reference:System.Security.dll XCIPTV-PC.cs EmbeddedVlc.cs NavigationUi.cs Cinema.cs
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed' }
          Copy-Item LEIA-ME.md,ANALISE_TECNICA.md dist
      - name: Install VLC for local media verification
        shell: pwsh
        run: |
          choco install vlc --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'VLC installation failed' }
      - name: Check protocol diagnostics and start native interface
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path dist/XCIPTV-PC.exe))
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Invalid PE executable' }
          $test = Start-Process (Resolve-Path dist/XCIPTV-PC.exe) -ArgumentList '--self-test' -PassThru
          if (!$test.WaitForExit(30000)) { $test.Kill(); throw 'Protocol tests timed out' }
          if ($test.ExitCode -ne 0) { throw 'Protocol diagnostics tests failed' }
          $p = Start-Process (Resolve-Path dist/XCIPTV-PC.exe) -ArgumentList '--smoke-test' -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); Get-Content dist/test-*.txt -ErrorAction SilentlyContinue; throw 'Interface initialization timeout' }
          if ($p.ExitCode -ne 0) { Get-Content dist/test-*.txt -ErrorAction SilentlyContinue; throw "Interface initialization failed: $($p.ExitCode)" }
          $media = Start-Process (Resolve-Path dist/XCIPTV-PC.exe) -ArgumentList '--player-test' -PassThru
          if (!$media.WaitForExit(45000)) { $media.Kill(); throw 'Internal media test timed out' }
          if ($media.ExitCode -ne 0) { throw 'Internal LibVLC local media playback failed' }
          $inputTest = Start-Process (Resolve-Path dist/XCIPTV-PC.exe) -ArgumentList '--input-test' -PassThru
          if (!$inputTest.WaitForExit(45000)) { $inputTest.Kill(); throw 'Native video input test timed out' }
          if ($inputTest.ExitCode -ne 0) { Get-Content dist/test-*.txt -ErrorAction SilentlyContinue; throw 'Native video mouse and controls test failed' }
          Get-FileHash dist/XCIPTV-PC.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XCIPTV-PC-Windows
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Interface-previews
          path: |
            dist/ui-previews/*.png
            dist/test-*.txt
          if-no-files-found: error
      - name: Publish downloadable preview
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.${{ github.run_number }}"
          Compress-Archive -Path dist/* -DestinationPath XCIPTV-PC-Windows.zip
          gh release create $tag dist/XCIPTV-PC.exe XCIPTV-PC-Windows.zip dist/SHA256.txt --target '${{ github.sha }}' --title "XCIPTV-PC Windows $tag" --prerelease --notes 'Sinopse com capas e fundo, ícones circulares responsivos, listas sem barras e dica de rolagem. Player flutuante com volume, mudo, legendas, proporção/zoom, saltos de 1 minuto e controles ocultos por inatividade. Gravação de trechos em MPEG-TS com confirmação para salvar em Vídeos; depende de formato e limite de conexões do provedor. Requer VLC 3 instalado. Testes locais de interface, reprodução e gravação no Windows.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; executable remains in workflow artifacts' }






